# gameparams.cfg -- the parameters this build uses (defaults: PowerSlave)
#
# Build-time game parameters.  The Makefile always reads `gameparams.cfg` and turns it into
# $(BUILD)/gameparams.h, which SPRITE.H includes.  Presets live in params/*.cfg and are NEVER
# read: copy one over gameparams.cfg, or point PARAMS at it for a single build:
#
#     make PARAMS=params/duke.cfg
#
# Syntax: KEY = VALUE, one per line, `#` starts a comment.  Every key becomes GP_<KEY>; a key
# whose value is a word also defines GP_<KEY>_<WORD> so C code can test it with #ifdef.
# Lengths are in Saturn units (u); the engine's own scale, 8 Build units = 1 u.

# --- player model -----------------------------------------------------------------------
# ball     : PowerSlave's own player -- a sphere of PLAYER_RADIUS, eye at radius + EYE_HOVER.
# cylinder : a vertical cylinder (PLRCYL.C) with standing/crouching/shrunk postures.  Only
#            this model reads the PLAYER_EYE_* / PLAYER_STEP_* / PLAYER_SHRINK_* keys below.
PLAYER_MODEL         = ball

PLAYER_RADIUS        = 47      # horizontal half-width

# A wall whose four corners are all nearer than this is not drawn at all (WALLS.C:1708), and
# collision parks the eye at exactly PLAYER_RADIUS from a wall plane (SPRITE.C:141) -- so a
# NEAR_CLIP at or above the radius makes every short wall vanish as you touch it.  PowerSlave
# shipped 32 against a radius of 47; keep the same ~2/3 ratio.
NEAR_CLIP            = 32

PLAYER_EYE_HOVER     = 8       # ball model: eye floats this far above the contact point
PLAYER_STEP          = 32      # ball model: step you can walk up

# --- cylinder postures (ignored by the ball model) --------------------------------------
PLAYER_EYE_STAND     = 80      # eye above the floor, standing
PLAYER_EYE_CROUCH    = 36      # ... crouching
PLAYER_EYE_SHRUNK    = 16      # ... shrunk
PLAYER_EYE_SWIM      = 30      # ... swimming
PLAYER_HEAD          = 8       # head above the eye
PLAYER_STEP_STAND    = 40      # step you can walk up, standing
PLAYER_STEP_CROUCH   = 2       # ... crouching or shrunk
PLAYER_EYE_SPEED     = 6       # how fast the eye travels between postures, u per frame
PLAYER_SHRINK_TENTHS = 96      # how long being shrunk lasts, tenths of a second
PLAYER_CRUSH_GAP     = 48      # growing back under a gap thinner than this kills you

# --- controls ---------------------------------------------------------------------------
# CROUCH_BUTTON  none  : the ACTION_WEPDN slot keeps its job (previous weapon).
#                wepdn : hold that button to crouch; ACTION_WEPUP then cycles the weapons.
#                        Needs PLAYER_MODEL = cylinder.
CROUCH_BUTTON        = none

# DEBUG_TOGGLE   none  : off.
#                lr_x  : hold L and R, press X to flip the engine's own cheat/debug mode
#                        (you then fly; hold A or C to descend; the automap prints
#                        x/y/sector, MAP.C:256).  Recommended.
#                lr    : hold R, press L.  Two buttons, but L and R ARE strafe and run,
#                        so this WILL fire by accident while playing.
DEBUG_TOGGLE         = none

# --- VDP1 texture cache -----------------------------------------------------------------
# PIC_SLOTS  slots per pic class (PIC.H order): 64x64 16 bpp = walls and floors, 64x64 8 bpp =
#            sprites, VDP2, 32x32 16 bpp, 32x32 8 bpp.  They share VDP1 VRAM (8 192, 4 096,
#            0, 2 048, 1 024 bytes a slot); keep the byte total when moving slots around.
PIC_SLOTS            = 28,31,1,10,12
