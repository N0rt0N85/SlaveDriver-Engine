# params/doom.cfg -- Doom, for maps converted by tools/doom2ps (PRESET, not read)
#
# Build-time game parameters.  The Makefile always reads `gameparams.cfg` and turns it into
# $(BUILD)/gameparams.h, which SPRITE.H includes.  Presets live in params/*.cfg and are NEVER
# read: copy one over gameparams.cfg, or point PARAMS at it for a single build:
#
#     make PARAMS=params/doom.cfg
#
# Syntax: KEY = VALUE, one per line, `#` starts a comment.  Every key becomes GP_<KEY>; a key
# whose value is a word also defines GP_<KEY>_<WORD> so C code can test it with #ifdef.
#
# SCALE: doom2ps converts 1:1 -- one Doom map unit IS one Saturn unit.  That is what makes the
# textures exact (a Doom texture is one texel per unit, a tile is 64 texels for 64 units), so the
# numbers below are Doom's own, straight out of its headers:
#   radius 16 (MT_PLAYER radius), height 56, view height 41 (VIEWHEIGHT), step 24 (MAXSTEPMOVE).
#
# The BALL model fits Doom almost exactly and leaves the engine's own player path untouched:
# the eye sits at radius + EYE_HOVER = 16 + 25 = 41, and the head clearance is the radius
# (SPR_HEAD, SPRITE.H), so the body is 41 + 16 = 57 u tall against Doom's 56.  Doom has no
# crouch, so none of the cylinder keys apply.

# --- player model -----------------------------------------------------------------------
# ball     : PowerSlave's own player -- a sphere of PLAYER_RADIUS, eye at radius + EYE_HOVER.
# cylinder : a vertical cylinder (PLRCYL.C) with standing/crouching/shrunk postures.  Only
#            this model reads the PLAYER_EYE_* / PLAYER_STEP_* / PLAYER_SHRINK_* keys below.
PLAYER_MODEL         = ball

# Beyond this distance (world units) a thing is drawn with four rotations instead of eight:
# front, both sides and back, the frame of the nearest 90 degrees.  A 64-texel chunk is
# 64 * 160 / distance pixels wide (FOCALDIST 160, half that in split screen), so 512 u is a
# monster about 17 px tall on a 224-line screen.  A family then needs 3 of the 31 thing tiles
# instead of 5, and the crowd's far half stops turning its tiles over.  0 = always eight.
THING_ROT4_DIST      = 512

# Beyond this distance (world units) a thing casts no shadow (0 = no distance limit, as in
# PowerSlave).  Doom has no shadows at all; the blob costs a VDP1 command and its fill under
# every monster, and the engine's own look keeps it where it reads.
THING_SHADOW_DIST    = 512
#
# Both of the keys below only say where the game STARTS: the pause's OPTIONS -> SHADOWS
# changes them with the level running, so they can be judged against each other.
# THING_SHADOW_MODE  how the blob under a thing is drawn:
#                      none    not drawn -- Doom itself has no shadows
#                      opaque  a plain black disc, one flat fill, no grid
#                      mesh    one pixel in two of pure black: free, but the grid shows
#                      shadow  the engine's own: the VDP1 darkens what is under it
#                      grain   shadow one pixel in two
#                    THING_SHADOW_DIST above limits how many are drawn.
# THING_SHADOW_SIZE  per cent of the blob's own 48 chunk pixels (10..200).
# SPECTRE_MODE       the spectre (MF_SHADOW), which Doom draws through a fuzz column map this
#                    engine has no equivalent of:
#                      mesh    the VDP1's checkerboard over its grey bank: a silhouette
#                      shadow  it darkens what is behind it instead of being drawn -- nearer
#                              the fuzz, but flat: no shape inside the silhouette
#                      grain   it darkens one pixel in two: grain, and the wall shows through
#                      dark    the shadow twice over: a quarter of the luminance, not a half
#                              (the manual's own recipe), at twice the pixels
#                      trans   HALF-TRANSPARENCY: half its colour and half what is behind, so
#                              the wall's own colours show through it.  Six times the cost of
#                              no calculation (VDP1 p.95), and on a colour-bank sprite the
#                              blend runs on CRAM indices -- to be SEEN, not reasoned about
#                      tgrain  the same on one pixel in two: three quarters of the wall
THING_SHADOW_MODE    = shadow
THING_SHADOW_SIZE    = 100
SPECTRE_MODE         = fuzz

# A monster chasing a marine it cannot see (the level's reject table says its leaf never sees any
# marine's) and farther than this from every marine runs A_Chase every other state: the state
# lasts twice as long and its step is twice as long, so it walks at the same speed and turns
# after about the same distance walked (one step more at most) -- it simply thinks half as
# often, and takes that walk in one stride instead of two.  It
# cannot attack from there (every attack needs a line of sight), and nothing of it is drawn.
# 0 = every monster thinks at the full rate, everywhere.
MONSTER_FAR_THINK    = 1536

# How many tics one line-of-sight answer is kept and shared (0 = every monster traces its own).
# canSee walks the ray leaf by leaf, testing every wall of each one twice: what it costs is the
# corridor of leaves it crosses, not where the two things stand inside them.  So the answer is
# filed under (the monster's leaf, which marine, the marine's leaf) and the other monsters of
# that leaf read it instead of tracing.  A_Look's phases are drawn at random when the level is
# placed, so two monsters of one leaf almost never look on the same tic: below a look period
# (10 tics) the file is never read.  The price is staleness -- a wake-up up to this many tics
# early or late -- and the 0.3-0.8 % of pairs where a monster at the edge of its leaf sees what
# its neighbour does not.
MONSTER_SIGHT_SHARE  = 10

# Beyond this distance a SLEEPING monster traces its line of sight every other A_Look instead of
# every one (0 = every look, everywhere).  It can still be woken instantly by a shot: the noise
# target is read before the trace and is not touched.  What it costs is up to 0.29 s more before
# a far monster notices you in silence -- and d32xr, which looks every 5 tics at 15 Hz, is
# already slower than that.
MONSTER_FAR_LOOK     = 1536

# Two missiles of the SAME kind closer than this to each other share one dynamic light: the
# second one is spawned without its own (0 = every missile carries its own).  The engine already
# does this for the plasma stream, where the bolts fly 75 u apart against a 160 u reach.  The
# light of a volley goes out when the bolt that carries it explodes, as every missile light does.
LIGHT_VOLLEY_DIST    = 80

PLAYER_RADIUS        = 16      # horizontal half-width (Doom MT_PLAYER radius)

# A wall whose four corners are all nearer than this is not drawn at all (WALLS.C:1708), and
# collision parks the eye at exactly PLAYER_RADIUS from a wall plane (SPRITE.C:141) -- so a
# NEAR_CLIP at or above the radius makes every short wall vanish as you touch it.  PowerSlave
# shipped 32 against a radius of 47; keep the same ~2/3 ratio.
NEAR_CLIP            = 10

PLAYER_EYE_HOVER     = 25      # ball model: eye floats this far above the contact point -> 41
PLAYER_STEP          = 24      # ball model: step you can walk up (Doom MAXSTEPMOVE)

# --- cylinder postures (ignored by the ball model) --------------------------------------
PLAYER_EYE_STAND     = 41
PLAYER_EYE_CROUCH    = 41
PLAYER_EYE_SHRUNK    = 41
PLAYER_EYE_SWIM      = 30
PLAYER_HEAD          = 15
PLAYER_STEP_STAND    = 24
PLAYER_STEP_CROUCH   = 24
PLAYER_EYE_SPEED     = 6
PLAYER_SHRINK_TENTHS = 96
PLAYER_CRUSH_GAP     = 48

# --- controls ---------------------------------------------------------------------------
# Doom has no crouch: the ACTION_WEPDN slot keeps its own job.
CROUCH_BUTTON        = none

# DEBUG_TOGGLE   lr_x : hold L and R, press X to flip the engine's own cheat/debug mode.
#                You then FLY (hold A or C to descend) and the automap prints x/y/sector
#                (MAP.C:256) -- which is how you tour a converted map to judge it.
DEBUG_TOGGLE         = lr_x

# --- game ---------------------------------------------------------------------------------
# GAME = doom -> GP_GAME doom and GP_GAME_DOOM 1 (gameparams.py word form): compiles game/doom/*.C
# into MAIN (Makefile GAME_C), the 35 Hz tic clock and the other CFG_* hooks of SPRITE.H
# (DOOM_ABI section 7-8, SPEC_RUNTIME section 9).  The disc data then comes from cd_doom/.
GAME                 = doom

# One CD track for the whole game: every level, the title and the credits loop CD track 2
# (SOUND.C).  The Doom disc carries a single audio track for now -- the PlayStation soundtrack's
# E1M1, added by the Makefile when MUSIC_doom names its .wav.  Without the key the engine plays
# PowerSlave's own track map.
MUSIC_TRACK          = 2

# A door wall whose opening is lower than this blocks the player (setDoorBlockBits, AI.C:4304
# WALLFLAG_SHORTOPENING; PowerSlave hard-codes 80).  Doom's player is 56 tall and E1M1's doors
# open to 68, so 80 would keep every one of them shut (DOOM_ABI section 6).
PLAYER_FIT_HEIGHT    = 56


# VDP1 VRAM slots per pic class: walls (64x64 16 bpp), sprites (64x64 8 bpp), VDP2, small 16 bpp,
# small 8 bpp.  Which wall gets a slot is PIC_LOD_PX's rule, below.  Doom never loads a
# 32x32 tile (doom2ps: walls 0x32, sprites and weapons 0x6A), so the two small classes are
# dead VRAM: their 20 480 + 12 288 bytes are exactly four more wall slots, same total.
PIC_SLOTS            = 32,31,1,0,0

# The wall tiles' rule (PIC.H).  A wall cell smaller than this on screen -- the SMALLER side of
# its box, in pixels: a far floor 2 px tall and 30 long would show 2 rows of its texture -- does
# not bring its tile into a slot: it is painted flat in the colour of the tile's first texel,
# under its own light.  When more tiles compete than there are slots less 4, the bar
# rises to the size of the last one that fits: the tiles are ranked by their biggest cell, the
# nearest keep theirs.  And a slot's texels never change while an image still to be drawn uses
# them: no wall shows another's texture.  0 = PowerSlave's cache.
PIC_LOD_PX           = 3

# Far LOD, every view (WALLS.C wallIsFar): a wall whose four corners are beyond this many units
# folds into ONE quad painted in its first tile's first texel under its corners' light, and a
# floor or ceiling welds its runs of one tile the same way.  No fog needed: at 2048 a 64-unit cell
# is 5 px in solo (focal 160), less in split screen.  When a view's fog is nearer, the far LOD
# comes in with it.  0 = off.
FAR_LOD              = 2048

# budget : solo follows split screen's rule (SRUINS.C mpBalance): a view's fog comes in when the
#          image's cells overflow the VDP1 list or the slave's records, 1/16 an image, and goes
#          out by 1/32; no fog while the budget holds, the L+R+Z toggle as a ceiling.
# toggle : solo's fog is the L+R+Z toggle alone (PowerSlave).
SOLO_FOG             = budget

# The fog also closes when the master is left WAITING FOR THE VDP1 for more than this many hblank
# lines an image, smoothed over four images (one line is about 63 us, a 60 Hz field is 262).  The
# command budget alone never fires in one view -- a solo image draws about 250 cells against a
# list of 1448 -- so the servo above was on and doing nothing while the console waited 27 ms an
# image for the drawing hardware (E1M3, 2026-09-23).  What the fog hides is exactly what the VDP1
# does not have to fill, so this is the knob that answers that wait.  It opens again below half
# this, so the fog cannot breathe at the image.  0 = the VDP1 is not a criterion.
VDP1_LATE            = 24

# --- dynamic lights (WALLS.C addLightEx, game/doom/DOOM_LIGHTS.H) --------------------------
# An addition: Doom has no dynamic light.  A source is R,G,B,RADIUS,INTENSITY:
#   R,G,B      tint, 0..16 per channel -- changes the colour only, not reach or strength
#   RADIUS     world units; wall cells are 64 u, so below ~128 a moving pool jumps between
#              vertices
#   INTENSITY  added at the centre, 0..31, on top of the room light (16 = gouraud neutral,
#              31 = ceiling).  Above 15 the centre saturates in a fully lit room over part of
#              the radius: 18 -> 29 %, 20 -> 37 %, 24 -> 46 %, 31 -> 55 %.
# The edge is soft (CFG_LIGHTSMOOTH): about 56 % of the intensity is left at half radius.
#                      R  G  B RAD INT
LIGHT_IMP            = 16,8,2,160,24       # imp fireball (BAL1)
LIGHT_CACO           = 16,6,14,160,24      # cacodemon shot (BAL2) -- tint to check
LIGHT_BARON          = 4,16,4,160,24       # baron shot (BAL7)
LIGHT_ROCKET         = 16,12,5,160,24      # rocket in flight
LIGHT_PLASMA         = 6,12,16,160,20      # plasma bolt (one lit per stream)
LIGHT_EXPLODE        = 16,13,8,256,31      # explosion (rocket, barrel), then fades
LIGHT_MUZZLE_PLAYER  = 16,9,3,512,12       # player muzzle flash, orange like its sprite.  Doom lights the whole
                                           # view (A_Light1/2): at 192 nothing past 150 u took any, and the floor
                                           # only shows from 58 u on.  512: +8 at 200 u, +5 at 300
LIGHT_MUZZLE_MONSTER = 16,14,10,192,24     # monster muzzle flash

# Durations in tics (35 Hz); the intensity fades linearly to zero.
# TELEPORT: the fog at both ends of a teleport.  Doom draws the fog and nothing else; the
# flash is an addition, and it lives exactly as long as the fog sprite (no duration of its own).
LIGHT_TELEPORT       = 10,14,16,224,28     # teleport fog, both ends
LIGHT_EXPLODE_TICS   = 6
LIGHT_MUZZLE_TICS    = 2      # full, then half

# --- title and loading screens (game/doom/DOOM_TITLE.C) ---------------------------------
# The DOOM logo over the PSX fire.  The algorithm is the reference's, cell by cell
# (saturn-refs/d32xr/m_fire.c, MIT), on the slave SH-2, one step per kick: a 320x72 band with 18
# solid white rows under it -- the shape of the 32X and PSX screens.  Nothing tunes the flames
# themselves any more: their height IS the reference's decay.
# FIRE_FIELDS    fields between two steps: 2 = 30 Hz; 1 = twice as fast (the slave then needs
#                a step in under a field); 0 = frozen.
# TITLE_MENU_Y0  the MULTIPLAYER line, from the screen's middle (NEW GAME a line above).
# FIRE_TITLE_Q8  chance x256 that a cell loses one of its 36 levels in a row.  128 IS the
#                reference (one row in two); lower makes the flames longer.
FIRE_TITLE_Q8        = 128
FIRE_FIELDS          = 2
TITLE_MENU_Y0        = 34
#
# The loading screen is the title going on: the same logo, the fire burning on, LOADING in its
# base.  The load does not raise the fire, it GROWS it: the decay falls from FIRE_LOAD_Q0 to
# FIRE_LOAD_Q1, so the flames go from a quarter of the band to longer than the band, and the
# logo is under fire whole when the last sector lands -- which is what says the level is about
# to start.  A flame is FIRE_MAX*256/Q rows long: 220 -> 42, 128 -> 72 (the reference),
# 38 -> 242, against 198 rows of band -- MORE than the band, so the last sectors are cut
# by the top of the screen: the fire is bigger than the image.
# FIRE_LOAD_LEAD     x256 of the load the flames run ahead: they need as many steps as rows to
#                    grow, and a load served from the drive's cache would show nothing at all.
# FIRE_LOAD_FIELDS   fields between two steps during a load; 0 = frozen, for the console A/B
#                    of the load time (STATUSTEXT L:, fields) against 2.
FIRE_LOAD_Q0         = 220
FIRE_LOAD_Q1         = 20
FIRE_LOAD_LEAD       = 64
FIRE_LOAD_FIELDS     = 1

# --- the pause (START in a level: game/doom/ovl/PAUSE.C, loaded from PAUSE.OVL) --------------
# PAUSE_VEIL  how much of the frozen view shows through the black veil: the VDP2 mixes a black
#             layer over it, view : veil = (PAUSE_VEIL+1) : (31-PAUSE_VEIL) (16 = about half as
#             bright; 31 = unchanged; 0 = nearly black).  A multiply: dark rooms stay readable.
PAUSE_VEIL           = 16

# --- the disc's own episodes (tools/doom2ps/episodes.py -> $(BUILD)/doom_episodes.h) ---------
# Everything the game knows about WHICH levels exist and where they lead is here, not in the C:
# a .cfg, a WAD and `make PARAMS=... iso` are a whole disc.  The converter reads the same list,
# so it converts exactly the maps named below (tools/doom2ps/make_e1m1.py --all).
#
# TITLE_LOGO      the WAD lump the title and the loading screen show, upscaled to the screen's
#                 own definition by wad2title.agrandir_logo.
# EPISODEn_NAME   what NEW GAME offers (n = 1, 2, 3... with no gap).  One episode: no list.
# EPISODEn_MAPS   the NORMAL road, in order: each level's exit leads to the next, the last one
#                 ends the episode.  These are the .LEV names on the disc, without extension.
# EPISODEn_SECRET the detours, in triples <from> <secret map> <back to>.  The secret maps are
#                 appended after the normal ones -- which is the order every level INDEX in the
#                 engine, and in a save, is counted in.
# EPISODEn_TITLES what the automap writes, one a map, separated by | and in the FINAL order
#                 (the normal road, then the secret maps).  The map's name goes in front.
# EPISODEn_PAR    the reference time in seconds, one a map, same order (PAUSE > STATISTICS).
# EPISODEn_BOSS   the levels a boss locks, in pairs <map> <MT_...> [how many].
#
# TITLE_LOGO      the WAD lump the title and the loading screen show.  The converter enlarges it
#                 by the largest WHOLE multiple that still fits the screen -- M_DOOM 123x60 goes
#                 to x2, TITLEPIC 320x200 stays at x1, its art being already at the screen's own
#                 definition.  A full picture is opaque, and the fire burns OVER it (NBG0 is
#                 priority 6 against NBG1's 5): the logo still burns away with the load.
# TITLE_LOGO_ROWS screen rows kept, from the top of the lump (0 = ALL of it, which is what the
#                 disc uses: TITLEPIC entire, 320x200, and the fire covers it as it grows.
#                 Cutting it is there for a lump that carries something one does not want on
#                 screen at all -- the id logo starts at TITLEPIC's row 148, so 133 would drop
#                 it and the price strip with it.
# TITLE_LOGO_Y    the screen row it starts on.
TITLE_LOGO           = TITLEPIC
TITLE_LOGO_ROWS      = 0
TITLE_LOGO_Y         = 0
EPISODE1_NAME        = KNEE-DEEP IN THE DEAD
EPISODE1_MAPS        = E1M1 E1M2 E1M3 E1M4 E1M5 E1M6 E1M7 E1M8
EPISODE1_SECRET      = E1M3 E1M9 E1M4
EPISODE1_TITLES      = Hangar|Nuclear Plant|Toxin Refinery|Command Control|Phobos Lab|Central Processing|Computer Station|Phobos Anomaly|Military Base
EPISODE1_PAR         = 30 75 120 90 165 180 180 30 165
EPISODE1_BOSS        = E1M8 MT_BRUISER 2
